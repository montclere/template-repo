<svg xmlns="http://www.w3.org/2000/svg" width="680" height="220" viewBox="0 0 680 220" role="img" aria-label="workflow: input → brief → approve → tasks → review">
<title>workflow: input → brief → approve → tasks → review</title>
<style>

.mono{font-family:'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}
.node{fill:#0B0A12;stroke:#5B4BC4;animation:lit 5s ease-in-out infinite}
@keyframes lit{0%,100%{stroke:#5B4BC4}12%{stroke:#E9E5FF}24%{stroke:#5B4BC4}}
.step{animation:step 5s steps(1) infinite;opacity:.35}
@keyframes step{0%{opacity:1}20%,100%{opacity:.35}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="680" height="220" rx="14" fill="#0B0A12"/>
<rect x="0.5" y="0.5" width="679" height="219" rx="14" fill="none" stroke="#251E45"/>
<line x1="98" y1="70" x2="192" y2="70" stroke="#251E45"/>
<circle class="node" cx="80" cy="70" r="17" style="animation-delay:0.0s"/>
<text class="mono" x="80" y="74" text-anchor="middle" fill="#E9E5FF" font-size="12">1</text>
<text class="mono" x="80" y="110" text-anchor="middle" fill="#F4F2FF" font-size="13">input</text>
<text class="sans" x="80" y="128" text-anchor="middle" fill="#A9A3C9" font-size="11">docs/input/</text>
<line x1="228" y1="70" x2="322" y2="70" stroke="#251E45"/>
<circle class="node" cx="210" cy="70" r="17" style="animation-delay:0.6s"/>
<text class="mono" x="210" y="74" text-anchor="middle" fill="#E9E5FF" font-size="12">2</text>
<text class="mono" x="210" y="110" text-anchor="middle" fill="#F4F2FF" font-size="13">brief</text>
<text class="sans" x="210" y="128" text-anchor="middle" fill="#A9A3C9" font-size="11">docs/BRIEF.md</text>
<line x1="358" y1="70" x2="452" y2="70" stroke="#251E45"/>
<circle class="node" cx="340" cy="70" r="17" style="animation-delay:1.2s"/>
<text class="mono" x="340" y="74" text-anchor="middle" fill="#E9E5FF" font-size="12">3</text>
<text class="mono" x="340" y="110" text-anchor="middle" fill="#F4F2FF" font-size="13">approve</text>
<text class="sans" x="340" y="128" text-anchor="middle" fill="#A9A3C9" font-size="11">you sign off</text>
<line x1="488" y1="70" x2="582" y2="70" stroke="#251E45"/>
<circle class="node" cx="470" cy="70" r="17" style="animation-delay:1.8s"/>
<text class="mono" x="470" y="74" text-anchor="middle" fill="#E9E5FF" font-size="12">4</text>
<text class="mono" x="470" y="110" text-anchor="middle" fill="#F4F2FF" font-size="13">tasks</text>
<text class="sans" x="470" y="128" text-anchor="middle" fill="#A9A3C9" font-size="11">one at a time</text>
<circle class="node" cx="600" cy="70" r="17" style="animation-delay:2.4s"/>
<text class="mono" x="600" y="74" text-anchor="middle" fill="#E9E5FF" font-size="12">5</text>
<text class="mono" x="600" y="110" text-anchor="middle" fill="#F4F2FF" font-size="13">review</text>
<text class="sans" x="600" y="128" text-anchor="middle" fill="#A9A3C9" font-size="11">V1 · V2, 1–5</text>
<line x1="470" y1="136" x2="470" y2="152" stroke="#251E45" stroke-dasharray="3 3"/>
<rect x="36" y="152" width="608" height="40" rx="10" fill="none" stroke="#251E45"/>
<text class="mono" x="52" y="177" fill="#8B7CF6" font-size="12">each task</text>
<text class="mono step" x="140" y="177" fill="#F4F2FF" font-size="12" style="animation-delay:0s">steps</text>
<text class="mono" x="187.0" y="177" fill="#6E6890" font-size="12">→</text>
<text class="mono step" x="210.0" y="177" fill="#F4F2FF" font-size="12" style="animation-delay:1s">code</text>
<text class="mono" x="249.8" y="177" fill="#6E6890" font-size="12">→</text>
<text class="mono step" x="272.8" y="177" fill="#F4F2FF" font-size="12" style="animation-delay:2s">make check</text>
<text class="mono" x="355.8" y="177" fill="#6E6890" font-size="12">→</text>
<text class="mono step" x="378.8" y="177" fill="#F4F2FF" font-size="12" style="animation-delay:3s">PROGRESS.md</text>
<text class="mono" x="469.0" y="177" fill="#6E6890" font-size="12">→</text>
<text class="mono step" x="492.0" y="177" fill="#F4F2FF" font-size="12" style="animation-delay:4s">commit T&lt;n&gt;</text>
<text class="mono" x="36" y="32" fill="#8B7CF6" font-size="12">brief → tasks → verified commits</text>
</svg>
